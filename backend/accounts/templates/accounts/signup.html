<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sign Up</title>
</head>
<body>

        {{ form.as_p }}

    <p><a href="{% url 'accounts:login' %}">Ja tenho conta</a></p>
</body>
</html>
